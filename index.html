<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的 AI 空间站</title>
    <style>
        :root {
            --primary-glow: #38bdf8;
            --accent-glow: #f59e0b;
            --neon-pink: #ec4899;
            --bg-glass: rgba(15, 23, 42, 0.62);
            --border-glass: rgba(56, 189, 248, 0.3);
            --font-zh: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            background-image: url('1790602688051.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: var(--font-zh);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            padding: 4.5rem clamp(0.8rem, 4vw, 1.6rem) 2rem;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* 赛博网格背景叠层 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
            background-size: 38px 38px;
            mask-image: radial-gradient(circle at center, rgba(0,0,0,0.9), transparent 78%);
            pointer-events: none;
            z-index: 0;
            animation: gridDrift 24s linear infinite;
        }

        @keyframes gridDrift {
            from { background-position: 0 0; }
            to   { background-position: 38px 38px; }
        }

        /* 音乐与音量整体控制容器 */
        .music-control-container {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 10;
        }

        .control-pill {
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 0.35rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            color: #7dd3fc;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
        }

        .music-control:hover {
            background: rgba(14, 165, 233, 0.3);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .volume-slider-box input[type="range"] {
            width: 60px;
            height: 4px;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        /* 科技感卡片 */
        .card {
            position: relative;
            z-index: 2;
            background: var(--bg-glass);
            backdrop-filter: blur(16px) saturate(140%);
            padding: clamp(1.6rem, 6vw, 2.4rem) clamp(1.2rem, 5vw, 1.8rem);
            border-radius: 1.4rem;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.85), 0 0 28px rgba(56, 189, 248, 0.18);
            text-align: center;
            max-width: 440px;
            width: 100%;
            border: 1px solid var(--border-glass);
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        h1 {
            margin: 0 0 0.9rem;
            color: #7dd3fc;
            text-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
            font-size: clamp(1.3rem, 5.5vw, 1.6rem);
            font-weight: 800;
        }

        p {
            color: #cbd5e1;
            margin: 0 0 1.4rem;
            font-size: clamp(0.9rem, 3.6vw, 1rem);
            line-height: 1.75;
        }

        #clock {
            font-family: var(--font-mono);
            font-size: clamp(0.85rem, 3.6vw, 0.98rem);
            color: #7dd3fc;
            margin: 0.2rem 0 1.6rem;
            font-weight: 600;
            background: rgba(14, 165, 233, 0.12);
            padding: 0.45rem 0.9rem;
            border-radius: 2rem;
            display: inline-block;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin-top: 1rem;
        }

        /* 统一合并按钮样式 */
        .btn {
            position: relative;
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #2563eb 55%, #4f46e5);
            color: #ffffff;
            padding: 0.95rem 1rem;
            border-radius: 0.8rem;
            text-decoration: none;
            font-weight: 700;
            font-size: clamp(0.95rem, 3.8vw, 1.02rem);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
            border: 1px solid rgba(125, 211, 252, 0.5);
            cursor: pointer;
            user-select: none;
            text-align: center;
            transition: transform 0.18s ease, box-shadow 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(56, 189, 248, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.22);
            color: #e2e8f0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(56, 189, 248, 0.6);
            color: #ffffff;
        }

        #story-box { text-align: left; display: none; }
        #story-title { color: #fbbf24; font-size: 1.25rem; margin-bottom: 0.8rem; }
        #story-text {
            min-height: 96px;
            margin-bottom: 1.3rem;
            color: #e2e8f0;
            background: rgba(0,0,0,0.25);
            padding: 0.95rem 1rem;
            border-radius: 0.6rem;
            border-left: 3px solid var(--accent-glow);
            white-space: pre-line;
            line-height: 1.75;
        }

        /* 🌸 桌宠悬浮挂件 */
        #cyber-pet {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 99;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        #pet-bubble {
            background: rgba(75, 18, 55, 0.9);
            border: 1px solid rgba(244, 114, 182, 0.7);
            color: #fbcfe8;
            padding: 0.4rem 0.8rem;
            border-radius: 0.8rem;
            font-size: 0.75rem;
            margin-bottom: 6px;
            backdrop-filter: blur(6px);
            white-space: nowrap;
            pointer-events: none;
            transition: transform 0.2s ease;
        }

        #pet-avatar {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: petIdleFloat 3.5s ease-in-out infinite;
        }

        @keyframes petIdleFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }

        #pet-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.25s ease-in-out, transform 0.25s ease-in-out;
        }

        #pet-img.switching {
            opacity: 0;
            transform: scale(0.85);
        }
    </style>
</head>
<body>
    <div class="music-control-container">
        <div class="control-pill music-control" id="musicBtn" onclick="toggleMusic()">
            <span id="musicIcon">🔇</span> <span id="musicText">BGM 关闭</span>
        </div>
        <div class="control-pill volume-slider-box">
            <span>🔈</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.7" oninput="adjustVolume(this.value)">
            <span>🔊</span>
        </div>
    </div>

    <audio id="bgm" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <div id="home-view">
            <h1>你只是怕了。这谁不怕</h1>
            <p>这是我在三星手机上通过 GitHub 搭建的第一个个人网页，正在探索数字世界。</p>
            <div><div id="clock">加载中...</div></div>
            <div class="btn-group">
                <button class="btn" onclick="startStory()">🚀 进入科幻任务</button>
                <a href="https://genshin.hoyoverse.com/zh-tw" class="btn btn-secondary" target="_blank" rel="noopener noreferrer" onclick="if(isPlaying) toggleMusic();">✨ 原神启动！</a>
            </div>
        </div>

        <div id="story-box">
            <h1 id="story-title"></h1>
            <div id="story-text"></div>
            <div id="story-choices" class="btn-group"></div>
        </div>
    </div>

    <div id="cyber-pet">
        <div id="pet-bubble">双击变大小，点我丝滑换动作！</div>
        <div id="pet-avatar">
            <img id="pet-img" src="yae.gif" alt="八重神子">
        </div>
    </div>

    <script>
        // 1. 实时时钟
        const updateClock = () => {
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('clock').innerText = 
                `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ` +
                `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        };
        updateClock();
        setInterval(updateClock, 1000);

        // 2. BGM 控制
        const bgm = document.getElementById('bgm');
        const musicIcon = document.getElementById('musicIcon');
        const musicText = document.getElementById('musicText');
        let isPlaying = false;
        bgm.volume = 0.7;

        function toggleMusic() {
            isPlaying ? bgm.pause() : bgm.play().catch(() => {});
            musicIcon.innerText = isPlaying ? "🔇" : "🔊";
            musicText.innerText = isPlaying ? "BGM 关闭" : "BGM 播放";
            isPlaying = !isPlaying;
        }

        const adjustVolume = val => { bgm.volume = val; };

        // 3. 剧情引擎
        const storyData = {
            start: {
                title: "⚠️ 紧急状态：深空警报",
                text: "你是一个失去通讯的空间站值班员。系统突然刺耳地鸣叫起来：氧气储备只能维持十分钟，而同时，舱外传来了身份不明的诡异求救信号。你决定先做什麽？",
                choices: [
                    { text: "1. 立即打开外部通讯频道", next: "comm" },
                    { text: "2. 检查空间站的氧气维持系统", next: "oxygen" },
                    { text: "3. 调出外景监控，调查求救信号来源", next: "signal" }
                ]
            },
            comm: {
                title: "📡 外部通讯尝试",
                text: "你尝试强行接通外部频道。电流声中传来机械合成音：‘警告，区域隔离已启动。’ 受到电磁冲击，氧气倒计时加速到了 5 分钟！",
                choices: [
                    { text: "立刻冲去手动检查氧气阀门", next: "oxygen_from_comm" },
                    { text: "强行向求救信号发送盲发请求", next: "ending_a" }
                ]
            },
            oxygen: {
                title: "⚙️ 氧气系统排查",
                text: "主氧气阀门被未知权限物理锁死。旁边有一个老旧的备用机械释放杆，但拉动它可能会引起电路短路。",
                choices: [
                    { text: "果断拉下备用机械释放杆！", next: "ending_b" },
                    { text: "放弃氧气，转头去查外景求救信号", next: "signal" }
                ]
            },
            oxygen_from_comm: {
                title: "⚙️ 绝境求生",
                text: "你冒险冲到氧气舱，在倒计时归零前砸下了备用机械释放杆。备用氧气喷涌而出！",
                choices: [{ text: "查看舱外情况", next: "ending_b" }]
            },
            signal: {
                title: "🌌 未知信号源",
                text: "屏幕上，一艘失踪三十年的同型号旧空间站正静静漂浮，不断重复发送摩斯密码。",
                choices: [
                    { text: "向它发送自动对接请求", next: "ending_c" },
                    { text: "切断外部电源，假装无事发生", next: "ending_a" }
                ]
            },
            ending_a: {
                title: "❌ 结局一：深空孤寂",
                text: "通讯彻底瘫痪，氧气耗尽。空间站化为了宇宙中冰冷的漂浮残骸。\n\n【达成结局：窒息迷失】",
                choices: [{ text: "🔄 重新开始", next: "start" }, { text: "🏠 返回首页", next: "home" }]
            },
            ending_b: {
                title: "✅ 结局二：绝境逢生",
                text: "联合舰队巡逻船检测到了你的应急求救波段，救援船缓缓靠岸。你得救了。\n\n【达成结局：死地后生】",
                choices: [{ text: "🔄 重新开始", next: "start" }, { text: "🏠 返回首页", next: "home" }]
            },
            ending_c: {
                title: "🌀 结局三：镜中镜像",
                text: "舱门开启，对面走出的那个身影穿着和你一模一样的制服，正微笑着向你伸出手……\n\n【达成结局：未知接触】",
                choices: [{ text: "🔄 重新开始", next: "start" }, { text: "🏠 返回首页", next: "home" }]
            }
        };

        const startStory = () => {
            if (!isPlaying) toggleMusic();
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('story-box').style.display = 'block';
            showNode('start');
        };

        const showNode = nodeKey => {
            const node = storyData[nodeKey];
            document.getElementById('story-title').innerText = node.title;
            document.getElementById('story-text').innerText = node.text;

            const choicesContainer = document.getElementById('story-choices');
            choicesContainer.innerHTML = '';

            node.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = `btn ${choice.next === 'home' ? 'btn-secondary' : ''}`;
                btn.innerText = choice.text;
                btn.onclick = () => choice.next === 'home' ? returnHome() : showNode(choice.next);
                choicesContainer.appendChild(btn);
            });
        };

        const returnHome = () => {
            document.getElementById('story-box').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
        };

        // 4. 🤖 现代化 Pointer Events 桌宠拖拽与互动逻辑
        const pet = document.getElementById('cyber-pet');
        const petImg = document.getElementById('pet-img');
        const bubble = document.getElementById('pet-bubble');

        const petActions = [
            { src: "yae.gif", text: "哎呀，小家伙，又在偷懒吗？" },
            { src: "yae_cry.gif", text: "呜…你怎么忍心欺负我嘛！" },
            { src: "yae.gif", text: "油豆腐，我的最爱~ 唔姆唔姆。" }
        ];

        let startX, startY, currentRight = 25, currentBottom = 25, hasMoved = false;
        const sizes = [
            { w: '70px', name: '小号模式' },
            { w: '100px', name: '标准模式' },
            { w: '140px', name: '大号看板娘' }
        ];
        let sizeIndex = 1;

        pet.addEventListener('dblclick', () => {
            sizeIndex = (sizeIndex + 1) % sizes.length;
            pet.style.width = pet.style.height = sizes[sizeIndex].w;
            document.getElementById('pet-avatar').style.width = document.getElementById('pet-avatar').style.height = sizes[sizeIndex].w;
            bubble.innerText = `已切换：${sizes[sizeIndex].name}`;
        });

        pet.addEventListener('pointerdown', e => {
            hasMoved = false;
            startX = e.clientX;
            startY = e.clientY;
            pet.setPointerCapture(e.pointerId);
        });

        pet.addEventListener('pointermove', e => {
            if (!e.buttons) return;
            hasMoved = true;
            currentRight -= (e.clientX - startX);
            currentBottom -= (e.clientY - startY);
            startX = e.clientX;
            startY = e.clientY;

            pet.style.right = Math.max(10, currentRight) + 'px';
            pet.style.bottom = Math.max(10, currentBottom) + 'px';
        });

        pet.addEventListener('pointerup', () => {
            if (!hasMoved) {
                const action = petActions[Math.floor(Math.random() * petActions.length)];
                petImg.classList.add('switching');
                setTimeout(() => {
                    petImg.src = action.src;
                    petImg.classList.remove('switching');
                }, 200);
                bubble.innerText = action.text;
            }
        });
    </script>
</body>
</html>
