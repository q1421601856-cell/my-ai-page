<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 AI 空间站</title>
    <style>
        body {
            /* 最外层大背景：直接读取你上传的 photo1.jpg */
            background-image: url('1790602688051.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            /* 中间卡片：改为半透明磨砂黑，这样能清晰透出你的背景大图 */
            background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(8px);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 { margin-bottom: 0.5rem; color: #38bdf8; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        p { color: #f1f5f9; margin-bottom: 1.5rem; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            /* 1. 加上这一行：让所有的变化都有 0.3 秒的平滑过渡动画 */
            transition: all 0.3s ease; 
        }

        /* 2. 鼠标悬停时的状态 */
        .btn:hover { 
            background: #60a5fa;                  /* 悬停时背景颜色变浅一点 */
            transform: translateY(-3px);           /* 悬停时按钮往上轻轻浮起 3 像素 */
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); /* 阴影变大，营造发光感 */
        }

        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>你只是怕了。这谁不怕</h1>
        <p>这是我在三星手机上通过 GitHub 搭建的第一个个人网页，正在探索 AI 的世界。</p>
        <a href="https://genshin.hoyoverse.com/zh-tw" class="btn" target="_blank">原神启动！</a>
    </div>
</body>
</html>
