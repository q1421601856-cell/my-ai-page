<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的 AI 空间站</title>
    <style>
        :root {
            --primary-glow: #38bdf8;
            --accent-glow: #f59e0b;
            --neon-blue: #0ea5e9;
            --bg-glass: rgba(15, 23, 42, 0.65);
            --border-glass: rgba(56, 189, 248, 0.3);
        }

        body {
            background-image: url('1790602688051.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.2rem;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* 赛博朋克高斯模糊科技感卡片 */
        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 2.2rem 1.6rem;
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15);
            text-align: center;
            max-width: 440px;
            width: 100%;
            border: 1px solid var(--border-glass);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-glow), transparent);
        }

        h1 {
            margin-bottom: 0.8rem;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            font-size: 1.45rem;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 1.5rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        /* 实时动态时钟美化 */
        #clock {
            font-size: 0.95rem;
            color: #38bdf8;
            margin-bottom: 1.5rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            letter-spacing: 1.5px;
            background: rgba(14, 165, 233, 0.1);
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            display: inline-block;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* 按钮与交互区域 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin-top: 1.2rem;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            padding: 0.95rem 1rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.25s ease;
            border: 1px solid rgba(125, 211, 252, 0.4);
            cursor: pointer;
            font-size: 1rem;
            box-sizing: border-box;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:hover {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
        }

        /* 剧情故事交互区域 */
        #story-box {
            text-align: left;
            display: none;
        }

        #story-title {
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }

        #story-text {
            min-height: 100px;
            margin-bottom: 1.4rem;
            color: #e2e8f0;
            font-size: 0.98rem;
            line-height: 1.65;
            background: rgba(0, 0, 0, 0.25);
            padding: 0.9rem;
            border-radius: 0.5rem;
            border-left: 3px solid #f59e0b;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 首页默认显示区域 -->
        <div id="home-view">
            <h1>你只是怕了。这谁不怕</h1>
            <p>这是我在三星手机上通过 GitHub 搭建的第一个个人网页，正在探索 AI 的世界。</p>
            
            <!-- 实时时钟 -->
            <div>
                <div id="clock">加载中...</div>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="startStory()">🚀 进入科幻任务</button>
                <a href="https://genshin.hoyoverse.com/zh-tw" class="btn btn-secondary" target="_blank" style="text-align: center;">✨ 原神启动！</a>
            </div>
        </div>

        <!-- 科幻互动剧情交互区域 -->
        <div id="story-box">
            <h1 id="story-title" style="font-size: 1.25rem; margin-bottom: 0.8rem;"></h1>
            <div id="story-text"></div>
            <div id="story-choices" class="btn-group"></div>
        </div>
    </div>

    <!-- 脚本：时钟与科幻剧情逻辑 -->
    <script>
        // 1. 实时时钟逻辑
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').innerText = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 2. 科幻互动剧情数据与状态机
        const storyData = {
            start: {
                title: "⚠️ 紧急状态：深空警报",
                text: "你是一个失去通讯的空间站值班员。系统突然刺耳地鸣叫起来：氧气储备只能维持十分钟，而同时，舱外传来了身份不明的诡异求救信号。你决定先做什麽？",
                choices: [
                    { text: "1. 立即打开外部通讯频道", next: "comm" },
                    { text: "2. 检查空间站的氧气维持系统", next: "oxygen" },
                    { text: "3. 调出外景监控，调查求救信号来源", next: "signal" }
                ]
            },
            comm: {
                title: "📡 外部通讯尝试",
                text: "你尝试强行接通外部频道。滋滋的电流声中，一个冰冷机械合成音响起：‘警告，区域隔离已启动，您已被锁定。’ 受到电磁冲击，氧气倒计时加速到了 5 分钟！",
                choices: [
                    { text: "情急之下，立刻冲去手动检查氧气阀门", next: "oxygen_from_comm" },
                    { text: "不管氧气，强行向求救信号发送盲发请求", next: "ending_a" }
                ]
            },
            oxygen: {
                title: "⚙️ 氧气系统排查",
                text: "你扑向主控制台，发现主氧气阀门被某种未知权限物理锁死。不过，旁边还有一个老旧的备用机械释放杆，但拉动它可能会引起电路短路。",
                choices: [
                    { text: "果断拉下备用机械释放杆！", next: "ending_b" },
                    { text: "放弃氧气，立刻转头去查外景求救信号", next: "signal" }
                ]
            },
            oxygen_from_comm: {
                title: "⚙️ 绝境求生",
                text: "你冒着剧烈喘息的危险冲到氧气舱，在倒计时归零前狠狠砸下了备用机械释放杆。伴随着沉闷的轰鸣，备用氧气喷涌而出！",
                choices: [
                    { text: "查看舱外情况", next: "ending_b" }
                ]
            },
            signal: {
                title: "🌌 未知信号源",
                text: "你调出外景摄像头。屏幕上，一艘早已失踪三十年的同型号旧空间站正静静地贴着你的舱体漂浮，上面没有任何生命体征，却正向你不断发送着重复的摩斯密码。",
                choices: [
                    { text: "向它发送自动对接请求", next: "ending_c" },
                    { text: "切断所有外部电源，假装这里什么也没有", next: "ending_a" }
                ]
            },
            ending_a: {
                title: "❌ 结局一：深空孤寂",
                text: "通讯彻底瘫痪，氧气耗尽。在黑暗与绝对的寂静中，你闭上双眼，空间站化为了宇宙中又一颗冰冷的漂浮残骸。\n\n【达成结局：窒息迷失】",
                choices: [{ text: "🔄 重新开始任务", next: "start" }, { text: "🏠 返回首页", next: "home" }]
            },
            ending_b: {
                title: "✅ 结局二：绝境逢生",
                text: "你成功手动开启了备用氧气！几分钟后，远处的联合舰队巡逻船检测到了你的应急求救波段，拖曳救援船缓缓靠岸。你得救了。\n\n【达成结局：死地后生】",
                choices: [{ text: "🔄 重新开始任务", next: "start" }, { text: "🏠 返回首页", next: "home" }]
            },
            ending_c: {
                title: "🌀 结局三：镜中镜像",
                text: "对接成功发出咔哒一声巨响。舱门缓缓开启，烟雾散去，对面走出的那个身影穿着和你一模一样的制服，正微笑着向你伸出手……\n\n【达成结局：未知接触】",
                choices: [{ text: "🔄 重新开始任务", next: "start" }, { text: "🏠 返回首页", next: "home" }]
            }
        };

        function startStory() {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('story-box').style.display = 'block';
            showNode('start');
        }

        function showNode(nodeKey) {
            const node = storyData[nodeKey];
            document.getElementById('story-title').innerText = node.title;
            document.getElementById('story-text').innerText = node.text;
            
            const choicesContainer = document.getElementById('story-choices');
            choicesContainer.innerHTML = '';
            
            node.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                if(choice.next === 'home') {
                    btn.className = 'btn btn-secondary';
                }
                btn.innerText = choice.text;
                btn.onclick = () => {
                    if(choice.next === 'home') {
                        returnHome();
                    } else {
                        showNode(choice.next);
                    }
                };
                choicesContainer.appendChild(btn);
            });
        }

        function returnHome() {
            document.getElementById('story-box').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
        }
    </script>
</body>
</html>
