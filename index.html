<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 AI 空间站</title>
    <style>
        body {
            /* 保留原有大背景与防重复平铺设置 */
            background-image: url('1790602688051.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .card {
            /* 中间半透明磨砂卡片 */
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(8px);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
            box-sizing: border-box;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.6);
        }
        h1 { margin-bottom: 0.5rem; color: #38bdf8; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 1.5rem; }
        p { color: #f1f5f9; margin-bottom: 1.2rem; text-shadow: 0 1px 2px rgba(0,0,0,0.5); font-size: 0.95rem; line-height: 1.5; }
        
        /* 实时时钟样式 */
        #clock {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            letter-spacing: 1px;
        }

        /* 按钮通用与触屏适配样式 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1rem;
        }
        .btn {
            display: block;
            width: 100%;
            background: #3b82f6;
            color: white;
            padding: 0.85rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .btn:hover {
            background: #60a5fa;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 剧情故事区域 */
        #story-box {
            text-align: left;
            display: none;
        }
        #story-text {
            min-height: 90px;
            margin-bottom: 1.2rem;
            color: #e2e8f0;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 首页默认显示区域 -->
        <div id="home-view">
            <h1>你只是怕了。这谁不怕</h1>
            <p>这是我在三星手机上通过 GitHub 搭建的第一个个人网页，正在探索 AI 的世界。</p>
            
            <!-- 实时时钟 -->
            <div id="clock">加载中...</div>

            <div class="btn-group">
                <button class="btn" onclick="startStory()">进入科幻任务</button>
                <a href="https://genshin.hoyoverse.com/zh-tw" class="btn btn-secondary" target="_blank" style="text-align: center;">原神启动！</a>
            </div>
        </div>

        <!-- 科幻互动剧情交互区域 -->
        <div id="story-box">
            <h1 id="story-title" style="font-size: 1.25rem; margin-bottom: 0.8rem; color: #f59e0b;"></h1>
            <div id="story-text"></div>
            <div id="story-choices" class="btn-group"></div>
        </div>
    </div>

    <!-- 脚本：时钟与科幻剧情逻辑 -->
    <script>
        // 1. 实时时钟逻辑
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').innerText = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // 2. 科幻互动剧情数据与状态机
        const storyData = {
            start: {

                choices: [
                    { text: "1. 立即打开外部通讯频道", next: "comm" },
                    { text: "2. 检查空间站的氧气维持系统", next: "oxygen" },

                ]
            },

                    { text: "不管氧气，强行向求救信号发送盲发请求", next: "ending_a" }
                ]
            },
            oxygen: {
                title: "⚙️ 氧气系统排查",
                text: "你扑向主控制台，发现主氧气阀门被某种未知权限物理锁死。不过，旁边还有一个老旧的备用机械释放杆，但拉动它可能会引起电路短路。",
                choices: [
                    { text: "果断拉下备用机械释放杆！", next: "ending_b" },
                    { text: "放弃氧气，立刻转头去查外景求救信号", next: "signal" }
                ]
            },
            oxygen_from_comm: {

                choices: [
                    { text: "查看舱外情况", next: "ending_b" }

            },
            signal: {
                title: "🌌 未知信号源",
                text: "你调出外景摄像头。屏幕上，一艘早已失踪三十年的同型号旧空间站正静静地贴着你的舱体漂浮，上面没有任何生命体征，却正向你不断发送着重复的摩斯密码。",
                choices: [
                    { text: "向它发送自动对接请求", next: "ending_c" },
                    { text: "切断所有外部电源，假装这里什么也没有", next: "ending_a" }

                choices: [{ text: "🔄 重新开始任务", next: "start" }, { text: "🏠 返回首页", next: "home" }]
